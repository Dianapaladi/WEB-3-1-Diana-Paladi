<!DOCTYPE html>
<head>
    <title>Piatra, Hârtia, Foarfeca</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f2f2f2;
            padding-top: 40px;
        }

        .game {
            background-color: white;
            width: 400px;
            margin: auto;
            padding: 25px;
            border-radius: 10px;
        }

        h1 {
            color: #333;
        }

        button {
            padding: 10px 18px;
            margin: 5px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            background-color: #ddd;
        }

        button:hover {
            background-color: #bbb;
        }

        #result {
            margin-top: 20px;
            color: #333;
        }

        .score {
            margin-top: 20px;
            padding: 10px;
            background-color: #f5f5f5;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <div class="game">
        <h1>Piatra, Hârtia, Foarfeca</h1>
        <button id="rock">Piatra</button>
        <button id="paper">Hârtia</button>
        <button id="scissors">Foarfeca</button>

        <h3>
            Tu ai ales:
            <span id="playerChoice">-</span>
        </h3>
        <h3>
            Calculatorul a ales:
            <span id="computerChoice">-</span>
        </h3>
        <h2 id="result">Alege o variantă!</h2>
        <div class="score">
            <h3>Scor</h3>

            <p> Tu: <span id="playerScore">0</span> </p>
            <p> Calculator: <span id="computerScore">0</span> </p>
            <p> Egalități: <span id="draws">0</span> </p>
        </div>

    </div>
    <script src="script.js"></script>
</body>
</html>
